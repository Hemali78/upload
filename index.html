<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgriVision</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top"><div class="bar">
  <div class="brand"><div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 21c0-7 1-12 7-16-1 7-3 11-7 16zM12 21C12 15 11 11 5 8c0 5 2 9 7 13z"/></svg></div>
    <div><b>AgriVision</b><small>Smart Agricultural Intelligence</small></div></div>
  <div class="right"><div class="pill" id="pill"><i></i><span>AI Assistant Ready</span></div>
    <button class="mic" id="mic" aria-label="Speak a command"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button></div>
</div></header>

<main class="wrap">
<section id="home">
  <div class="grid">
    <button class="card" id="cardScan"><div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2F7D4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 17c0-5 1-8 8-10-1 5-2 8-8 10z"/></svg></div>
      <h2>Scan Crop</h2><p>Upload or capture a leaf image to identify possible crop diseases using AI analysis.</p><div class="cta">Scan a crop <span>→</span></div></button>
    <button class="card" id="cardVoice"><div class="ico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2F7D4F" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3M2 9v4M22 9v4"/></svg></div>
      <h2>Voice Assistant</h2><p>Talk to AgriVision and control the app with voice commands, hands-free. Try “check my crop”.</p><div class="cta">Start speaking <span>→</span></div></button>
  </div>
  <h3>Recent Scan <button class="lnk" id="clr">Clear</button></h3>
  <div class="list" id="recent"></div>
</section>

<section id="scan" hidden>
  <button class="lnk" id="back">← Back to home</button>
  <h1>Scan Crop</h1>
  <p class="mu">Use a clear, well-lit photo of one leaf. Supported crops:</p>
  <div class="crops"><span>Tomato</span><span>Potato</span><span>Bell Pepper</span></div>
  <div class="cols">
    <div class="panel">
      <div class="tabs"><button id="tUp" class="on">Upload</button><button id="tCam">Camera</button></div>
      <div id="pUp"><label class="drop" id="drop"><b>Drop a leaf photo here</b><span class="mu">or click to choose a file</span><input id="file" type="file" accept="image/*" hidden></label></div>
      <div id="pCam" hidden><video id="vid" autoplay playsinline muted></video>
        <div class="btns"><button class="btn" id="snap">Capture photo</button><button class="btn alt" id="stop">Stop camera</button></div></div>
      <img id="prev" alt="Selected leaf" hidden>
    </div>
    <div class="panel" id="res" aria-live="polite"><div class="idle">Your result will appear here.</div></div>
  </div>
</section>
</main>
<div id="dock" role="status"></div>

<script src="script.js"></script>
</body>
</html>
